<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Docent · Sociogram</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="brand">Sociogram</p>
          <p class="tagline" id="who"></p>
        </div>
        <div class="stack-actions">
          <a class="btn btn-ghost" href="/admin.html" id="admin-link" hidden>Admin</a>
          <button type="button" class="btn btn-ghost" id="logout">Uitloggen</button>
        </div>
      </header>

      <main class="grid-2">
        <section class="card">
          <h1>Mijn klassen</h1>
          <ul id="class-list" class="student-list"></ul>
          <label for="new-class">Nieuwe klas</label>
          <input id="new-class" type="text" placeholder="bijv. 2MB" />
          <label for="new-students">Leerlingen (één per regel)</label>
          <textarea id="new-students" rows="6" placeholder="Anna&#10;Boris&#10;Carmen"></textarea>
          <button type="button" class="btn" id="btn-create">Klas aanmaken</button>
        </section>

        <section class="card" id="class-panel" hidden>
          <h1 id="class-title">Klas</h1>
          <p class="hint">Zet vragen aan/uit, maak één invullink voor de hele klas, bekijk het sociogram.</p>
          <div id="q-list" class="question-list"></div>
          <div class="stack-actions">
            <button type="button" class="btn" id="btn-save-q">Vragen opslaan</button>
            <button type="button" class="btn btn-secondary" id="btn-link">Maak / vernieuw invullink</button>
          </div>
          <p class="hint" id="link-out"></p>
          <button type="button" class="btn btn-ghost" id="btn-viz">Toon sociogram</button>
          <div class="viz-wrap" style="margin-top: 12px">
            <svg id="sociogram-svg" viewBox="0 0 900 560"></svg>
          </div>
          <ul id="signals" class="signals"></ul>
        </section>
      </main>
    </div>
    <script src="/js/sociogram.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
